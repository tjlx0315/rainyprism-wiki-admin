name: Publish Rainy Prism site

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'wiki/**'
      - 'site/**'
      - '.github/workflows/wiki-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wiki
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: wiki/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec next build --webpack
        env:
          NEXT_PUBLIC_BASE_PATH: /rainyprism-wiki-admin/wiki
      - name: Assemble homepage, exhibition and wiki branches
        working-directory: .
        run: |
          mv wiki/out wiki-built
          mkdir -p wiki/out
          mv wiki-built wiki/out/wiki
          cp -R site/. wiki/out/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: wiki/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
