name: Publish wiki frontend

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'wiki/**'
      - '.github/workflows/wiki-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wiki
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: wiki/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Add the private-data-free editor to the site
        run: |
          mkdir -p public/editor/css public/editor/js
          cp ../index.html public/editor/index.html
          cp ../css/app.css public/editor/css/app.css
          cp ../js/app.js public/editor/js/app.js
          cp ../js/storage.js public/editor/js/storage.js
      - run: pnpm exec next build --webpack
        env:
          NEXT_PUBLIC_BASE_PATH: /rainyprism-wiki-admin
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: wiki/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
