<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#061521" />
  <title>雨夜</title>
  <style>
    :root {
      --paper: #dce8ee;
      --ink: #06131c;
      --frame: #111b21;
      --line: rgba(220, 235, 240, .26);
      --ease-out: cubic-bezier(.23, 1, .32, 1);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--ink); }
    body { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--paper); }
    button, a { color: inherit; font: inherit; }

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      isolation: isolate;
      background: radial-gradient(circle at 62% 28%, #2a5772 0, #102f43 38%, #061722 82%);
    }

    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    .intro-brand {
      position: absolute;
      z-index: 9;
      top: 18vh;
      left: 10vw;
      max-width: 520px;
      opacity: 0;
      transform: translateY(18px);
      animation: reveal-brand 1.2s var(--ease-out) .25s forwards;
    }

    .intro-brand small {
      display: block;
      margin-bottom: 18px;
      font: 10px/1 monospace;
      letter-spacing: .2em;
      color: rgba(220, 232, 238, .62);
    }

    .intro-brand h1 {
      margin: 0;
      transform: translateX(-.06em);
      font-family: "Songti SC", "STSong", "SimSun", serif;
      font-size: clamp(72px, 8vw, 132px);
      font-weight: 400;
      line-height: .92;
      letter-spacing: .015em;
      text-shadow: 0 10px 38px rgba(0, 8, 18, .24);
    }

    .intro-brand p {
      margin: 22px 0 0;
      font-family: "STSong", "Songti SC", "SimSun", serif;
      font-size: clamp(14px, 1.1vw, 18px);
      font-weight: 300;
      letter-spacing: .06em;
      color: rgba(220, 232, 238, .7);
    }

    @keyframes reveal-brand {
      to { opacity: 1; transform: translateY(0); }
    }

    .room-shadow {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(2,8,12,.82) 0 5.5vw, transparent 12vw calc(100% - 8vw), rgba(2,8,12,.72) calc(100% - 3vw)),
        linear-gradient(rgba(2,8,12,.68) 0 5vh, transparent 12vh calc(100% - 16vh), rgba(2,8,12,.38));
      box-shadow: inset 0 0 120px rgba(0,0,0,.34);
    }

    .window-frame {
      position: absolute;
      inset: 7vh 7vw 15vh;
      z-index: 4;
      pointer-events: none;
      border: clamp(8px, 1vw, 17px) solid rgba(12,22,28,.9);
      box-shadow: 0 0 0 2px rgba(179,205,215,.12), inset 0 0 45px rgba(1,11,17,.18);
    }

    .window-frame::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 58%;
      width: clamp(7px, .75vw, 13px);
      background: rgba(12,22,28,.9);
      box-shadow: 1px 0 rgba(179,205,215,.08);
    }

    .window-frame::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 14%;
      height: clamp(5px, .55vw, 10px);
      background: rgba(12,22,28,.78);
    }

    .desk {
      position: absolute;
      z-index: 7;
      left: 0;
      right: 0;
      bottom: 0;
      height: 18vh;
      pointer-events: none;
      background:
        linear-gradient(174deg, transparent 0 14%, rgba(20,27,29,.92) 15% 18%, transparent 19%),
        linear-gradient(180deg, #20282a 0, #11191c 48%, #070d0f 100%);
      box-shadow: 0 -15px 45px rgba(0,0,0,.25);
    }

    .flowers {
      position: absolute;
      z-index: 8;
      left: 13vw;
      bottom: 11vh;
      width: clamp(105px, 12vw, 190px);
      height: clamp(190px, 29vh, 310px);
      pointer-events: none;
      filter: drop-shadow(10px 15px 14px rgba(0,0,0,.35));
    }

    .flowers svg { width: 100%; height: 100%; overflow: visible; }
    .stem { fill: none; stroke: #5e7470; stroke-width: 3; stroke-linecap: round; }
    .leaf { fill: #485d59; }
    .petal { fill: #c8d2cf; }
    .petal.dim { fill: #81999b; }
    .vase { fill: #151e22; stroke: rgba(213,230,235,.18); stroke-width: 2; }

    .enter-card {
      position: absolute;
      z-index: 10;
      left: 50%;
      bottom: 1.45rem;
      min-width: min(390px, 54vw);
      min-height: 58px;
      padding: 10px 13px 10px 21px;
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-rows: auto auto;
      align-items: center;
      column-gap: 24px;
      transform: translate(-50%, 12px);
      color: rgba(235, 242, 244, .82);
      text-decoration: none;
      opacity: 0;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: linear-gradient(145deg, rgba(225, 239, 243, .12), rgba(8, 27, 39, .2));
      box-shadow: inset 0 1px rgba(255,255,255,.28), 0 14px 36px rgba(0, 8, 16, .18);
      backdrop-filter: blur(14px) saturate(1.15);
      -webkit-backdrop-filter: blur(14px) saturate(1.15);
      animation: reveal-enter 1.1s var(--ease-out) 1.1s forwards;
      transition: color 260ms var(--ease-out), border-color 260ms var(--ease-out), background 260ms var(--ease-out), box-shadow 260ms var(--ease-out);
    }

    .enter-card small { grid-column: 1; font: 9px/1 monospace; letter-spacing: .18em; color: rgba(220,232,238,.48); }
    .enter-card strong { grid-column: 1; font: 300 16px/1.4 "STSong", "Songti SC", serif; letter-spacing: .1em; }
    .enter-card i { grid-column: 2; grid-row: 1 / 3; width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid rgba(225,238,241,.32); border-radius: 50%; font-family: Arial, sans-serif; font-size: 15px; font-style: normal; transition: transform 300ms var(--ease-out), background 300ms var(--ease-out); }

    .enter-card:hover,
    .enter-card:focus-visible { color: #fff; border-color: rgba(226,239,243,.5); background: linear-gradient(145deg, rgba(225,239,243,.17), rgba(8,27,39,.26)); box-shadow: inset 0 1px rgba(255,255,255,.34), 0 18px 44px rgba(0,8,16,.24); }
    .enter-card:hover i,
    .enter-card:focus-visible i { transform: translateX(3px); background: rgba(225,238,241,.1); }

    a:focus-visible,
    button:focus-visible { outline: 2px solid rgba(170, 209, 220, .9); outline-offset: 4px; }

    @keyframes reveal-enter {
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    .weather {
      position: absolute;
      z-index: 10;
      left: 2rem;
      bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 10px;
      font: 10px/1 monospace;
      letter-spacing: .13em;
      opacity: .4;
    }

    .weather i { width: 54px; height: 1px; background: currentColor; opacity: .55; }

    .sound-toggle {
      position: absolute;
      z-index: 11;
      right: 2rem;
      bottom: 2rem;
      min-height: 38px;
      padding: 0 15px;
      border: 1px solid rgba(220,235,240,.16);
      border-radius: 999px;
      background: rgba(8, 25, 35, .12);
      color: rgba(220,232,238,.52);
      font-size: 10px;
      letter-spacing: .16em;
      cursor: pointer;
      transition: color 260ms var(--ease-out), background 260ms var(--ease-out), transform 260ms var(--ease-out);
    }

    .sound-toggle:hover,
    .sound-toggle:focus-visible,
    .sound-toggle[aria-pressed="true"] { color: rgba(255,255,255,.86); background: rgba(220,235,240,.08); }

    @media (hover: hover) and (pointer: fine) {
      .sound-toggle:hover { transform: translateY(-1px); }
    }

    @media (max-width: 720px) {
      .window-frame { inset: 6vh 4vw 17vh; }
      .window-frame::before { left: 64%; }
      .flowers { left: 8vw; bottom: 12vh; width: 110px; height: 210px; }
      .weather { left: 1rem; bottom: 1.2rem; }
      .sound-toggle { right: 1rem; bottom: 1.2rem; }
      .intro-brand { top: 12vh; left: 8vw; }
      .intro-brand h1 { font-size: 19vw; }
      .enter-card { bottom: 1rem; min-width: calc(100vw - 150px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .intro-brand,
      .enter-card { opacity: 1; transform: translate(-50%, 0); animation: none; transition-duration: .01ms; }
      .intro-brand { transform: none; }
    }

    @media (prefers-reduced-transparency: reduce) {
      .enter-card { background: #142a3a; backdrop-filter: none; -webkit-backdrop-filter: none; }
    }

  </style>
</head>
<body>
  <main class="scene" aria-label="安静的雨夜窗景。">
    <canvas id="scene"></canvas>
    <div class="intro-brand">
      <small>RAINY PRISM / INTRO</small>
      <h1>雨棱镜</h1>
      <p>一切的一切都已向前铺陈。</p>
    </div>
    <div class="room-shadow"></div>
    <div class="window-frame"></div>

    <div class="flowers" aria-hidden="true">
      <svg viewBox="0 0 180 300">
        <path class="stem" d="M91 241 C88 185 74 121 47 58 M91 241 C99 175 122 117 143 73 M91 241 C96 173 91 100 94 39 M91 241 C81 186 59 149 27 127" />
        <path class="leaf" d="M76 185 C46 160 40 143 44 137 C64 141 78 153 82 175Z" />
        <path class="leaf" d="M101 173 C126 146 142 141 148 146 C136 165 121 176 104 181Z" />
        <path class="leaf" d="M76 140 C54 123 50 108 54 104 C70 110 79 120 82 135Z" />
        <g transform="translate(45 55)"><circle class="petal dim" cx="0" cy="0" r="16"/><circle class="petal" cx="-13" cy="5" r="12"/><circle class="petal" cx="12" cy="8" r="12"/><circle class="petal dim" cx="1" cy="13" r="11"/></g>
        <g transform="translate(95 37)"><circle class="petal" cx="0" cy="0" r="17"/><circle class="petal dim" cx="-14" cy="4" r="12"/><circle class="petal" cx="12" cy="7" r="12"/><circle class="petal dim" cx="2" cy="14" r="10"/></g>
        <g transform="translate(144 72)"><circle class="petal dim" cx="0" cy="0" r="15"/><circle class="petal" cx="-12" cy="4" r="11"/><circle class="petal dim" cx="11" cy="8" r="12"/></g>
        <g transform="translate(27 126)"><circle class="petal" cx="0" cy="0" r="14"/><circle class="petal dim" cx="-10" cy="5" r="10"/><circle class="petal" cx="10" cy="7" r="10"/></g>
        <path class="vase" d="M54 205 C63 220 60 233 52 250 C47 261 48 282 58 292 L125 292 C135 280 136 262 130 250 C121 232 120 219 129 205 C109 213 74 213 54 205Z" />
      </svg>
    </div>

    <div class="desk"></div>
    <div class="weather"><span>RAIN / DESK</span><i></i></div>
    <a class="enter-card" href="index.html">
      <small>ENTER / 进入</small>
      <strong>按任意键进入主页面</strong>
      <i aria-hidden="true">→</i>
    </a>
    <button class="sound-toggle" type="button" aria-pressed="false">开启声音</button>
    <audio id="track-a" preload="metadata"></audio>
    <audio id="track-b" preload="metadata"></audio>
  </main>

  <script>
    (() => {
      const canvas = document.querySelector('#scene');
      const ctx = canvas.getContext('2d');
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const soundToggle = document.querySelector('.sound-toggle');
      const players = [document.querySelector('#track-a'), document.querySelector('#track-b')];
      const playlist = [
        'audio/rain-piano-01.m4a',
        'audio/rain-piano-02.m4a',
        'audio/rain-piano-03.m4a'
      ];
      const rain = [];
      const view = { w: 0, h: 0, dpr: 1, window: null, intensity: .72, target: .72, wind: .35, targetWind: .35, flash: 0 };
      let last = performance.now();
      let weatherClock = 0;
      let activePlayer = 0;
      let currentTrack = -1;
      let soundtrackStarted = false;
      let crossfading = false;
      let muted = false;

      const random = (min, max) => min + Math.random() * (max - min);
      let nextLightning = random(18000, 42000);

      function chooseTrack() {
        if (playlist.length < 2) return 0;
        let next = currentTrack;
        while (next === currentTrack) next = Math.floor(Math.random() * playlist.length);
        return next;
      }

      function fadeVolume(player, from, to, duration, done) {
        const startedAt = performance.now();
        function step(now) {
          const progress = Math.min(1, (now - startedAt) / duration);
          player.volume = from + (to - from) * progress;
          if (progress < 1) requestAnimationFrame(step);
          else if (done) done();
        }
        requestAnimationFrame(step);
      }

      async function beginTrack(playerIndex, trackIndex, fadeIn = true) {
        const player = players[playerIndex];
        currentTrack = trackIndex;
        player.src = playlist[trackIndex];
        player.volume = fadeIn ? 0 : .34;
        player.muted = muted;
        await player.play();
        if (fadeIn) fadeVolume(player, 0, .34, 2200);
      }

      async function startSoundtrack() {
        if (soundtrackStarted) return;
        try {
          soundtrackStarted = true;
          await beginTrack(activePlayer, chooseTrack());
          soundToggle.textContent = '声音：开';
          soundToggle.setAttribute('aria-pressed', 'true');
        } catch (error) {
          soundtrackStarted = false;
          soundToggle.textContent = '再次尝试声音';
        }
      }

      async function crossfadeToNext() {
        if (!soundtrackStarted || crossfading) return;
        crossfading = true;
        const oldIndex = activePlayer;
        const nextIndex = oldIndex === 0 ? 1 : 0;
        const oldPlayer = players[oldIndex];
        try {
          await beginTrack(nextIndex, chooseTrack());
          fadeVolume(oldPlayer, oldPlayer.volume, 0, 2800, () => {
            oldPlayer.pause();
            oldPlayer.removeAttribute('src');
            oldPlayer.load();
            activePlayer = nextIndex;
            crossfading = false;
          });
        } catch (error) {
          crossfading = false;
        }
      }

      players.forEach((player) => {
        player.addEventListener('timeupdate', () => {
          if (player !== players[activePlayer] || !Number.isFinite(player.duration)) return;
          if (player.duration - player.currentTime <= 3.2) crossfadeToNext();
        });
        player.addEventListener('ended', crossfadeToNext);
      });

      soundToggle.addEventListener('click', () => {
        if (!soundtrackStarted) {
          startSoundtrack();
          return;
        }
        muted = !muted;
        players.forEach((player) => { player.muted = muted; });
        soundToggle.textContent = muted ? '声音：关' : '声音：开';
        soundToggle.setAttribute('aria-pressed', String(!muted));
      });

      function resize() {
        view.w = innerWidth;
        view.h = innerHeight;
        view.dpr = Math.min(devicePixelRatio || 1, 1.25);
        canvas.width = Math.floor(view.w * view.dpr);
        canvas.height = Math.floor(view.h * view.dpr);
        ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
        view.window = {
          x: view.w * (view.w < 720 ? .04 : .07),
          y: view.h * (view.w < 720 ? .06 : .07),
          w: view.w * (view.w < 720 ? .92 : .86),
          h: view.h * (view.w < 720 ? .77 : .78)
        };
        const count = Math.min(150, Math.max(70, Math.floor(view.w * view.h / 11000)));
        rain.length = 0;
        for (let i = 0; i < count; i++) rain.push(makeRain(true));
      }

      function makeRain(initial = false) {
        const box = view.window || { x: 0, y: 0, w: view.w, h: view.h };
        return {
          x: random(box.x - 30, box.x + box.w + 10),
          y: initial ? random(box.y, box.y + box.h) : box.y - random(5, box.h * .25),
          len: random(24, 58),
          speed: random(300, 610),
          alpha: random(.16, .48),
          width: Math.random() < .12 ? 1.25 : .75
        };
      }

      function drawBackdrop() {
        const g = ctx.createLinearGradient(0, view.window.y, 0, view.window.y + view.window.h);
        g.addColorStop(0, '#173e58');
        g.addColorStop(.55, '#0c2b3f');
        g.addColorStop(1, '#071b28');
        ctx.fillStyle = g;
        ctx.fillRect(view.window.x, view.window.y, view.window.w, view.window.h);

        ctx.save();
        ctx.beginPath();
        ctx.rect(view.window.x, view.window.y, view.window.w, view.window.h);
        ctx.clip();
        if (view.flash > .002) {
          ctx.fillStyle = `rgba(196,220,235,${view.flash})`;
          ctx.fillRect(view.window.x, view.window.y, view.window.w, view.window.h);
        }
        ctx.restore();
      }

      function updateRain(dt) {
        const box = view.window;
        const activeCount = Math.floor(rain.length * view.intensity);
        ctx.save();
        ctx.beginPath();
        ctx.rect(box.x, box.y, box.w, box.h);
        ctx.clip();
        ctx.lineCap = 'round';
        for (let i = 0; i < activeCount; i++) {
          const drop = rain[i];
          drop.y += drop.speed * dt;
          drop.x += view.wind * drop.speed * dt * .055;
          const tailX = drop.x - view.wind * drop.len * .055;
          const tailY = drop.y - drop.len;
          ctx.beginPath();
          ctx.strokeStyle = `rgba(197,220,230,${drop.alpha})`;
          ctx.lineWidth = drop.width;
          ctx.moveTo(tailX, tailY);
          ctx.lineTo(drop.x, drop.y);
          ctx.stroke();
          if (drop.y > box.y + box.h + 28 || drop.x > box.x + box.w + 35 || drop.x < box.x - 35) {
            Object.assign(drop, makeRain(false));
          }
        }
        ctx.restore();
      }

      function animate(now) {
        const dt = Math.min(.034, (now - last) / 1000);
        last = now;
        weatherClock += dt;
        if (weatherClock > 7) {
          weatherClock = 0;
          view.target = random(.42, .92);
          view.targetWind = random(-1.15, 1.15);
        }
        view.intensity += (view.target - view.intensity) * dt * .12;
        view.wind += (view.targetWind - view.wind) * dt * .22;
        view.flash *= Math.pow(.025, dt);
        if (!reduceMotion && now > nextLightning) {
          view.flash = random(.07, .13);
          nextLightning = now + random(18000, 42000);
        }
        ctx.clearRect(0, 0, view.w, view.h);
        drawBackdrop();
        updateRain(reduceMotion ? 0 : dt);
        requestAnimationFrame(animate);
      }

      addEventListener('resize', resize);
      addEventListener('keydown', () => { location.href = 'index.html'; }, { once: true });
      resize();
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
