<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>雨棱镜｜世界观百科后台 V1</title>

<link rel="stylesheet" href="./css/app.css?v=4">
</head>


<body>

<div class="app">

  <!-- =====================================================
       左侧主导航
  ====================================================== -->
  <aside class="sidebar">

    <div class="brand">雨棱镜</div>
    <div class="brand-sub">世界观百科 · 后台</div>

    <nav class="nav">

      <button
        class="nav-btn active"
        data-view="cards"
      >
        卡片
      </button>

      <button
        class="nav-btn"
        data-view="relations"
      >
        总关系网
      </button>

      <button
        class="nav-btn"
        data-view="timeline"
      >
        时间轴
      </button>

    </nav>

    <div class="sidebar-bottom">
      <span class="sidebar-info">
        V1 · Local <span class="sidebar-info-icon">i</span>
        <span class="sidebar-info-tip">数据保存在当前浏览器<br>云端数据库与图床后续接入</span>
      </span>
    </div>

  </aside>


  <!-- =====================================================
       主区域
  ====================================================== -->
  <main class="main">

    <div class="content">

      <div class="inner">

        <aside class="card-catalog">
          <h2 class="catalog-title">卡片目录</h2>
          <input id="globalSearch" class="catalog-search" type="text" placeholder="搜索卡片……">
          <select id="cardTypeFilter" class="hidden"><option value="">全部类型</option></select>
          <div id="cardGrid" class="catalog-list"></div>
          <button id="newCardBtn" class="btn primary catalog-new">＋ 新建卡片</button>
          <div class="catalog-data-tools">
            <button id="exportWikiDataBtn" class="btn primary" type="button">发布百科</button>
            <button id="exportDataBtn" class="btn" type="button">导出备份</button>
            <button id="importDataBtn" class="btn" type="button">导入备份</button>
          </div>
          <input id="importDataInput" class="hidden" type="file" accept="application/json,.json">
        </aside>


        <!-- =================================================
             卡片视图
        ================================================== -->
        <section
          id="cardsView"
          class="view active"
        >

          <div class="cards-welcome">
            从左侧目录选择一张卡片开始编辑<br>
            或新建一张世界观卡片
          </div>

        </section>


        <!-- =================================================
             编辑器视图
        ================================================== -->
        <section
          id="editorView"
          class="view"
        ></section>


        <!-- =================================================
             关系网
        ================================================== -->
        <section
          id="relationsView"
          class="view"
        >

          <div class="view-head">

            <div>

              <div class="eyebrow">
                RELATION MAP
              </div>

              <h1 class="view-title">
                总关系网
              </h1>

              <div class="view-desc">
                按住 Shift，依次点击两个角色即可添加人物关系
              </div>

            </div>

            <div class="filters">

              <select id="relationTypeFilter">
                <option value="">全部类型</option>
                <option value="角色" selected>只看角色</option>
                <option value="组织">只看组织</option>
                <option value="地区">只看地区</option>
                <option value="事件">只看事件</option>
                <option value="其他">只看其他</option>
              </select>

              <select id="relationFocus">
                <option value="">
                  全部卡片
                </option>
              </select>

              <select id="relationLayoutMode">
                <option value="free">自由布局</option>
                <option value="primary">主要角色居中</option>
              </select>

              <select id="relationPrimaryFolder" title="核心角色文件夹">
                <option value="">选择核心文件夹</option>
              </select>

              <select id="relationSnapMode">
                <option value="off">关闭吸附</option>
                <option value="square">方形网格吸附</option>
                <option value="hex">六边形吸附</option>
              </select>

              <details class="network-relation-filter">
                <summary>关系显示</summary>
                <div id="networkRelationFilterList" class="network-relation-filter-list"></div>
              </details>

              <div class="network-viewport-controls" aria-label="关系网视图控制">
                <button id="fitNetworkBtn" class="btn" type="button">适应全部</button>
                <button id="centerPrimaryNetworkBtn" class="btn" type="button">主要角色居中</button>
                <button id="resetNetworkZoomBtn" class="btn" type="button">100%</button>
                <span id="networkZoomValue" class="network-zoom-value">100%</span>
              </div>

              <button
                id="resetNetworkBtn"
                class="btn"
              >
                重新布局
              </button>

            </div>

          </div>


          <div class="network-layout">

            <canvas id="relationCanvas"></canvas>

            <aside
              id="relationDetail"
              class="network-detail"
            ></aside>

          </div>

        </section>


        <!-- =================================================
             全局时间轴
        ================================================== -->
        <section
          id="timelineView"
          class="view"
        >

          <div class="view-head">

            <div>

              <div class="eyebrow">
                TIMELINE
              </div>

              <h1 class="view-title">
                时间轴
              </h1>

              <div class="view-desc">
                整个世界观的时间节点
              </div>

            </div>

            <button id="newTimelineNodeBtn" class="btn primary" type="button">
              ＋ 新建时间节点
            </button>

          </div>


          <div class="global-timeline-wrap">

            <div class="global-timeline-main">

              <div class="timeline-controls">

                <select id="timelineCardFilter">
                  <option value="">
                    全部卡片
                  </option>
                </select>

                <input
                  id="timelineTagFilter"
                  type="text"
                  placeholder="按标签筛选"
                >

                <select id="timelineLayoutMode">
                  <option value="smart">
                    智能排列
                  </option>

                  <option value="real">
                    时间比例
                  </option>
                </select>

              </div>

              <div
                id="globalTimeline"
                class="timeline"
              ></div>

            </div>

            <aside
              id="timelineDetail"
              class="timeline-detail"
            ></aside>

          </div>

        </section>


      </div>

    </div>

  </main>

</div>


<!-- =========================================================
     Drawer
========================================================= -->

<div
  id="drawerMask"
  class="drawer-mask"
>

  <aside
    id="drawer"
    class="drawer"
  ></aside>

</div>


<!-- =========================================================
     Modal
========================================================= -->

<div
  id="modalMask"
  class="modal-mask"
>

  <div
    id="modal"
    class="modal"
  ></div>

</div>


<!-- =========================================================
     Toast
========================================================= -->

<div
  id="toast"
  class="toast"
></div>


<script src="./js/storage.js?v=5"></script>
<script src="./js/app.js?v=12"></script>

</body>
</html>
